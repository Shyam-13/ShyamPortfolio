<!DOCTYPE html>
<html>
<head>
<title>Cricket Score App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:Arial;background:#eef2f5}
body{display:flex;justify-content:center}

/* APP CARD */
.card{
  width:100%;
  min-height:100vh;
  max-width:600px;
  background:#fff;
  padding:clamp(8px,2vw,14px);
  overflow-y:auto;
}
@media(min-width:768px){
  .card{margin:12px 0;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
}

/* TEXT */
h2,h3,h4{text-align:center;margin:4px 0}
.score{font-size:clamp(24px,7vw,36px);font-weight:bold;text-align:center}
.currentOver{font-size:12px;color:#555;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* INPUT */
input{padding:6px;font-size:12px;max-width:150px;margin:3px}

/* BUTTONS */
.btn-row{display:flex;flex-wrap:wrap;justify-content:center}
button{
  padding:8px;margin:4px;width:100%;max-width:100px;
  font-size:12px;border:none;border-radius:6px;
  cursor:pointer;position:relative;overflow:hidden;
  transition:transform .08s ease;
}
button:active{transform:scale(.94)}
button:disabled{opacity:.4}
button::after{
  content:"";position:absolute;top:50%;left:50%;
  width:0;height:0;background:rgba(255,255,255,.35);
  border-radius:50%;transform:translate(-50%,-50%);
}
button:active::after{width:120%;height:120%;transition:.4s}

/* COLORS */
.start{background:#2e7d32;color:#fff}
.reset{background:#b71c1c;color:#fff}
.ctrl{background:#1565c0;color:#fff}
.undo{background:#333;color:#fff}
.dot{background:#607d8b;color:#fff}
.wide{background:#ff9800;color:#fff}
.nb{background:#9c27b0;color:#fff}
.w{background:#e53935;color:#fff}

/* RESULT */
.result{text-align:center;font-weight:bold;margin-top:6px}
.result.win{color:#2e7d32;animation:winPop .6s ease}
@keyframes winPop{
  0%{transform:scale(.6);opacity:0}
  60%{transform:scale(1.15);opacity:1}
  100%{transform:scale(1)}
}

/* FLOAT ANIMATION */
.float-score{
  position:fixed;z-index:9999;font-weight:bold;
  pointer-events:none;font-size:22px;
  animation:floatUp .8s ease-out forwards;
}
@keyframes floatUp{
  0%{transform:translateY(0);opacity:1}
  60%{transform:translateY(-40px) scale(1.3)}
  100%{transform:translateY(-80px) scale(.8);opacity:0}
}
.float-score.run{color:#2e7d32}
.float-score.extra{color:#ff9800}
.float-score.wicket{color:#e53935}

/* HISTORY UI */
.history-box{
  background:#f5f5f5;
  border-radius:6px;
  padding:8px;
  font-size:13px;
  max-height:35vh;
  overflow-y:auto;
  line-height:1.5;
}
</style>
</head>

<body>

<!-- MAIN SCREEN -->
<div class="card" id="mainScreen">
<h2>Cricket Score App</h2>

<div align="center">
<input id="teamA" value="Team A"> vs
<input id="teamB" value="Team B">
</div>

<div align="center">
Total Overs:
<input type="number" id="totalOvers" value="10" min="1">
</div>

<div class="btn-row">
<button class="start" id="startBtn" onclick="startMatch()">START</button>
<button class="reset" onclick="resetMatch()">RESET</button>
</div>

<div class="btn-row">
<button class="ctrl" id="overHistoryBtn" onclick="openOverHistory()" disabled>OVER HISTORY</button>
<button class="ctrl" onclick="openMatchHistory()">MATCH HISTORY</button>
</div>

<h3 id="inningText">—</h3>
<div class="score" id="score">0/0</div>
<div class="currentOver" id="currentOver">Current Over: —</div>
<div align="center" id="overs">Overs: 0.0</div>
<div align="center" id="target"></div>

<div class="btn-row">
<button class="dot scoreBtn" onclick="ball(0,event)" disabled>0</button>
<button class="scoreBtn" onclick="ball(1,event)" disabled>1</button>
<button class="scoreBtn" onclick="ball(2,event)" disabled>2</button>
<button class="scoreBtn" onclick="ball(3,event)" disabled>3</button>
<button class="scoreBtn" onclick="ball(4,event)" disabled>4</button>
<button class="scoreBtn" onclick="ball(5,event)" disabled>5</button>
<button class="scoreBtn" onclick="ball(6,event)" disabled>6</button>
</div>

<div class="btn-row">
<button class="wide scoreBtn" onclick="extra('Wd',event)" disabled>Wide</button>
<button class="nb scoreBtn" onclick="extra('Nb',event)" disabled>No Ball</button>
</div>

<div class="btn-row">
<button class="w scoreBtn" onclick="wicket(event)" disabled>Wicket</button>
</div>

<div class="btn-row">
<button class="undo" onclick="undo()">UNDO</button>
<button class="ctrl" onclick="endInnings()">END INNINGS</button>
</div>

<div class="result" id="result"></div>
</div>

<!-- OVER HISTORY -->
<div class="card" id="overHistoryScreen" style="display:none">
<h2>Over History</h2>
<h3 id="overInningText"></h3>

<h4>First Innings</h4>
<div id="firstOverHistory" class="history-box"></div>

<h4>Second Innings</h4>
<div id="secondOverHistory" class="history-box"></div>

<div class="btn-row">
<button class="ctrl" onclick="backToMain()">BACK</button>
</div>
</div>

<!-- MATCH HISTORY -->
<div class="card" id="matchHistoryScreen" style="display:none">
<h2>Match History</h2>
<div id="matchList" class="history-box"></div>

<div class="btn-row">
<button class="ctrl" onclick="backToMain()">BACK</button>
</div>
</div>

<script>
/* ================= STATE ================= */
let started = false;
let inning = 1;

let runs = 0;
let wickets = 0;
let balls = 0;              // LEGAL balls only
let totalBalls = 0;
let target = null;
let matchOver = false;

let history = [[]];
let firstHistory = null;
let secondHistory = null;

let stack = [];
let matches = JSON.parse(localStorage.getItem("matches")) || [];

/* ================= HELPERS ================= */
function canPlay(){
  return started && !matchOver && balls < totalBalls;
}

function saveState(){
  stack.push(JSON.stringify({
    runs, wickets, balls,
    history, inning,
    target, matchOver,
    firstHistory, secondHistory
  }));
}

function enableScore(enable){
  document.querySelectorAll(".scoreBtn")
    .forEach(b => b.disabled = !enable);

  overHistoryBtn.disabled = !started;
}

/* ================= TAP ANIMATION ================= */
function showTap(text,x,y,type){
  const el=document.createElement("div");
  el.className=`float-score ${type}`;
  el.innerText=text;
  el.style.left=x+"px";
  el.style.top=y+"px";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),800);
}

/* ================= MATCH ================= */
function startMatch(){
  totalBalls = Number(totalOvers.value) * 6;

  started = true;
  inning = 1;
  runs = wickets = balls = 0;
  history = [[]];
  firstHistory = secondHistory = null;
  target = null;
  matchOver = false;
  stack = [];

  startBtn.disabled = true;
  inningText.innerText = "First Innings";
  result.innerText = "";

  enableScore(true);
  update();
}

/* ================= SCORING ================= */
function ball(r,e){
  if(!canPlay()) return;

  saveState();

  runs += r;
  balls++;
  history.at(-1).push(r===0 ? "." : r);

  if(balls % 6 === 0) history.push([]);

  showTap(r===0?"•":"+"+r, e.clientX, e.clientY, "run");
  update();
}

function wicket(e){
  if(!canPlay()) return;

  saveState();

  wickets++;
  balls++;
  history.at(-1).push("W");

  if(balls % 6 === 0) history.push([]);

  showTap("W", e.clientX, e.clientY, "wicket");
  update();
}

function extra(type,e){
  if(!canPlay()) return;

  saveState();

  let ex = parseInt(prompt("Runs on " + type, 1)) || 1;
  runs += ex;
  history.at(-1).push(`${type}+${ex}`);

  showTap(`${type}+${ex}`, e.clientX, e.clientY, "extra");
  update();
}

/* ================= INNINGS ================= */
function endInnings(){
  if(inning !== 1) return;

  saveState();

  firstHistory = JSON.parse(JSON.stringify(history));
  target = runs + 1;

  runs = wickets = balls = 0;
  history = [[]];
  inning = 2;

  inningText.innerText = "Second Innings";
  update();
}

/* ================= UPDATE ================= */
function update(){
  score.innerText = `${runs}/${wickets}`;
  overs.innerText = `Overs: ${Math.floor(balls/6)}.${balls%6}`;
  currentOver.innerText =
    `Current Over: ${history.at(-1).join(" ") || "—"}`;

  /* ✅ TARGET DISPLAY FIX */
  if(inning === 2 && target !== null){
    targetEl.innerText = `Target: ${target}`;
  } else {
    targetEl.innerText = "";
  }

  enableScore(started && !matchOver);

  /* ✅ AUTO END FIRST INNINGS */
  if(inning === 1 && balls === totalBalls){
    endInnings();
    return;
  }

  /* ✅ MATCH RESULT (SECOND INNINGS ONLY) */
  if(inning === 2 && !matchOver){
    if(runs >= target){
      finish(teamB.value);        // chasing team wins
    }
    else if(balls === totalBalls || wickets === 10){
      finish(teamA.value);        // defending team wins
    }
  }
}

/* ================= FINISH ================= */
function finish(winner){
  matchOver = true;

  result.innerText = `${winner} WON THE MATCH 🎉`;
  result.classList.add("win");

  secondHistory = JSON.parse(JSON.stringify(history));

  matches.push({
    teams: `${teamA.value} vs ${teamB.value}`,
    winner,
    first: firstHistory,
    second: secondHistory
  });

  localStorage.setItem("matches", JSON.stringify(matches));
  enableScore(false);
}

/* ================= UNDO ================= */
function undo(){
  if(!stack.length) return;

  let s = JSON.parse(stack.pop());

  runs = s.runs;
  wickets = s.wickets;
  balls = s.balls;
  history = s.history;
  inning = s.inning;
  target = s.target;
  matchOver = s.matchOver;
  firstHistory = s.firstHistory;
  secondHistory = s.secondHistory;

  result.innerText = "";
  result.classList.remove("win");

  update();
}

/* ================= HISTORY ================= */
function overRuns(o){
  return o.reduce((s,b)=>{
    if(b==="."||b==="W") return s;
    if(typeof b==="number") return s+b;
    if(b.includes("+")) return s+parseInt(b.split("+")[1]);
    return s;
  },0);
}

function formatOver(h,isLive){
  if(!h) return "—";
  let html="";
  h.forEach((o,i)=>{
    if(!o.length) return;
    let lbl = isLive && i===h.length-1
      ? `<b>Current Over</b>`
      : `<b>Over ${i+1}</b>`;
    html += `${lbl}: ${o.join(" ")} | Runs: ${overRuns(o)}<br>`;
  });
  return html;
}

function openOverHistory(){
  mainScreen.style.display="none";
  overHistoryScreen.style.display="block";

  overInningText.innerText =
    `Current Innings: ${inning===1?"First":"Second"}`;

  if(inning===1){
    firstOverHistory.innerHTML = formatOver(history,true);
    secondOverHistory.innerHTML = "—";
  }else{
    firstOverHistory.innerHTML = formatOver(firstHistory,false);
    secondOverHistory.innerHTML = formatOver(history,true);
  }
}

function openMatchHistory(){
  mainScreen.style.display="none";
  matchHistoryScreen.style.display="block";

  matchList.innerHTML =
    matches.map((m,i)=>`
      <b>Match ${i+1}</b><br>
      ${m.teams}<br>
      Winner: ${m.winner}<br><br>
    `).join("") || "No matches yet";
}

function backToMain(){
  document.querySelectorAll(".card")
    .forEach(c=>c.style.display="none");
  mainScreen.style.display="block";
}

/* ================= RESET ================= */
function resetMatch(){
  location.reload();
}
</script>



</body>
</html>
