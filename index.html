<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
}

html,body{
  margin:0;
  padding:0;
  height:100%;
  font-family:Arial;
  background:#eef2f5;
}

/* SCROLL ENABLED */
body{
  display:flex;
  justify-content:center;
}

/* APP CONTAINER */
.card{
  width:100%;
  min-height:100vh;
  max-width:600px;
  background:#fff;
  padding:clamp(8px, 2vw, 14px);
  overflow-y:auto; /* ✅ scrollbar enabled */
}

/* DESKTOP */
@media(min-width:768px){
  .card{
    border-radius:12px;
    margin:12px 0;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
  }
}

/* HEADINGS */
h2{
  font-size:clamp(16px, 4vw, 22px);
}
h3,h4{
  font-size:clamp(14px, 3.5vw, 18px);
}
h2,h3,h4{
  text-align:center;
  margin:4px 0;
}

/* SCORE */
.score{
  font-size:clamp(24px, 7vw, 36px);
  font-weight:bold;
  text-align:center;
}

/* OVER TEXT */
.currentOver{
  font-size:clamp(11px, 2.8vw, 14px);
  color:#555;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* INPUTS */
input{
  padding:clamp(5px, 1.5vw, 8px);
  font-size:clamp(11px, 2.8vw, 14px);
  width:100%;
  max-width:150px;
  margin:3px;
}

/* FLEX ROW */
.btn-row{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}

/* 🔑 RESPONSIVE BUTTONS */
button{
  padding:clamp(6px, 1.8vw, 12px);
  margin:clamp(3px, 1vw, 6px);
  width:100%;
  max-width:clamp(70px, 18vw, 110px);
  font-size:clamp(11px, 2.8vw, 14px);
  border:none;
  border-radius:6px;
  cursor:pointer;
}

button:disabled{
  opacity:.4;
}

/* ACTION BUTTONS */
.start,.reset,.ctrl,.undo{
  max-width:clamp(150px, 45vw, 260px);
  font-size:clamp(12px, 3vw, 15px);
}

/* COLORS */
.start{background:#2e7d32;color:#fff}
.reset{background:#b71c1c;color:#fff}
.ctrl{background:#1565c0;color:#fff}
.undo{background:#333;color:#fff}
.dot{background:#607d8b;color:#fff}
.wide{background:#ff9800;color:#fff}
.nb{background:#9c27b0;color:#fff}
.w{background:#e53935;color:#fff}

.result{
  text-align:center;
  font-size:clamp(13px, 3vw, 16px);
  font-weight:bold;
  margin-top:6px;
}
</style>
