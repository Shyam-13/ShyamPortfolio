<!DOCTYPE html>
<html>
<head>
<title>Cricket Score App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  font-family:Arial;
  background:#eef2f5;
}

body{
  display:flex;
  justify-content:center;
}

/* APP */
.card{
  width:100%;
  min-height:100vh;
  max-width:600px;
  background:#fff;
  padding:clamp(8px,2vw,14px);
  overflow-y:auto;
}

/* DESKTOP */
@media(min-width:768px){
  .card{
    margin:12px 0;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
  }
}

h2,h3,h4{
  text-align:center;
  margin:4px 0;
}

.score{
  font-size:clamp(24px,7vw,36px);
  font-weight:bold;
  text-align:center;
}

.currentOver{
  font-size:clamp(11px,2.8vw,14px);
  color:#555;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

input{
  padding:clamp(5px,1.5vw,8px);
  font-size:clamp(11px,2.8vw,14px);
  max-width:150px;
  margin:3px;
}

.btn-row{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}

button{
  padding:clamp(6px,1.8vw,12px);
  margin:clamp(3px,1vw,6px);
  max-width:clamp(70px,18vw,110px);
  width:100%;
  font-size:clamp(11px,2.8vw,14px);
  border:none;
  border-radius:6px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:transform .08s ease;
}

button:active{transform:scale(.94)}
button:disabled{opacity:.4}

button::after{
  content:"";
  position:absolute;
  top:50%;
  left:50%;
  width:0;
  height:0;
  background:rgba(255,255,255,.35);
  border-radius:50%;
  transform:translate(-50%,-50%);
}
button:active::after{
  width:120%;
  height:120%;
  transition:.4s;
}

/* COLORS */
.start{background:#2e7d32;color:#fff}
.reset{background:#b71c1c;color:#fff}
.ctrl{background:#1565c0;color:#fff}
.undo{background:#333;color:#fff}
.dot{background:#607d8b;color:#fff}
.wide{background:#ff9800;color:#fff}
.nb{background:#9c27b0;color:#fff}
.w{background:#e53935;color:#fff}

/* RESULT */
.result{
  text-align:center;
  font-weight:bold;
  margin-top:6px;
}

/* WIN ANIMATION */
@keyframes winPop{
  0%{transform:scale(.6);opacity:0}
  60%{transform:scale(1.15);opacity:1}
  100%{transform:scale(1)}
}
.result.win{
  animation:winPop .6s ease;
  color:#2e7d32;
}

/* FLOATING TAP ANIMATION */
.float-score{
  position:fixed;
  z-index:9999;
  pointer-events:none;
  font-weight:bold;
  font-size:clamp(16px,5vw,26px);
  animation:floatUp .8s ease-out forwards;
}
@keyframes floatUp{
  0%{transform:translateY(0);opacity:1}
  60%{transform:translateY(-40px) scale(1.3)}
  100%{transform:translateY(-80px) scale(.8);opacity:0}
}
.float-score.run{color:#2e7d32}
.float-score.extra{color:#ff9800}
.float-score.wicket{color:#e53935}
</style>
</head>

<body>

<div class="card">
<h2>Cricket Score App</h2>

<div align="center">
<input id="teamA" value="Team A"> vs
<input id="teamB" value="Team B">
</div>

<div align="center">
Total Overs:
<input type="number" id="totalOvers" value="10" min="1">
</div>

<div class="btn-row">
<button class="start" id="startBtn" onclick="startMatch()">START</button>
<button class="reset" onclick="resetMatch()">RESET</button>
</div>

<h3 id="inningText">—</h3>
<div class="score" id="score">0/0</div>
<div class="currentOver" id="currentOver">Current Over: —</div>
<div align="center" id="overs">Overs: 0.0</div>
<div align="center" id="target"></div>

<div class="btn-row">
<button class="dot scoreBtn" onclick="ball(0,event)" disabled>0</button>
<button class="scoreBtn" onclick="ball(1,event)" disabled>1</button>
<button class="scoreBtn" onclick="ball(2,event)" disabled>2</button>
<button class="scoreBtn" onclick="ball(3,event)" disabled>3</button>
<button class="scoreBtn" onclick="ball(4,event)" disabled>4</button>
<button class="scoreBtn" onclick="ball(5,event)" disabled>5</button>
<button class="scoreBtn" onclick="ball(6,event)" disabled>6</button>
</div>

<div class="btn-row">
<button class="wide scoreBtn" onclick="extra('Wd',event)" disabled>Wide</button>
<button class="nb scoreBtn" onclick="extra('Nb',event)" disabled>No Ball</button>
</div>

<div class="btn-row">
<button class="w scoreBtn" onclick="wicket(event)" disabled>Wicket</button>
</div>

<div class="btn-row">
<button class="undo" onclick="undo()">UNDO</button>
<button class="ctrl" onclick="endInnings()">END</button>
</div>

<div class="result" id="result"></div>
</div>

<script>
let started=false, inning=1;
let runs=0,wickets=0,balls=0,totalBalls=0,target=0,matchOver=false;
let history=[[]],stack=[];

function enableScore(e){
document.querySelectorAll(".scoreBtn").forEach(b=>b.disabled=!e);
}

function showTapAnimation(text,x,y,type){
const el=document.createElement("div");
el.className=`float-score ${type}`;
el.innerText=text;
el.style.left=x+"px";
el.style.top=y+"px";
document.body.appendChild(el);
setTimeout(()=>el.remove(),800);
}

function startMatch(){
totalBalls=totalOvers.value*6;
started=true;
enableScore(true);
startBtn.disabled=true;
inningText.innerText="First Innings";
update();
}

function ball(r,e){
if(!started||matchOver)return;
runs+=r;balls++;
history.at(-1).push(r===0?".":r);
if(balls%6===0)history.push([]);
showTapAnimation(r===0?"•":"+"+r,e.clientX,e.clientY,"run");
update();
}

function extra(t,e){
let ex=parseInt(prompt("Runs on "+t,1))||1;
runs+=ex;
history.at(-1).push(t+"+"+ex);
showTapAnimation(t+"+"+ex,e.clientX,e.clientY,"extra");
update();
}

function wicket(e){
wickets++;balls++;
history.at(-1).push("W");
if(balls%6===0)history.push([]);
showTapAnimation("W",e.clientX,e.clientY,"wicket");
update();
}

function endInnings(){
target=runs+1;
runs=wickets=balls=0;
history=[[]];
inning=2;
inningText.innerText="Second Innings";
update();
}

function update(){
score.innerText=`${runs}/${wickets}`;
overs.innerText=`Overs: ${Math.floor(balls/6)}.${balls%6}`;
currentOver.innerText=`Current Over: ${history.at(-1).join(" ")||"—"}`;
target.innerText=inning===2?`Target: ${target}`:"";

if(inning===2&&!matchOver){
if(runs>=target)finish(teamB.value);
else if(balls>=totalBalls||wickets>=10)finish(teamA.value);
}
}

function finish(winner){
matchOver=true;
result.innerText=`${winner} WON THE MATCH 🎉`;
result.classList.add("win");
enableScore(false);
}

function undo(){
location.reload();
}

function resetMatch(){
location.reload();
}

/* OVER HISTORY */
function overRuns(o){
return o.reduce((s,b)=>{
if(b==="."||b==="W")return s;
if(typeof b==="number")return s+b;
if(b.includes("+"))return s+parseInt(b.split("+")[1]);
return s;
},0);
}
function formatOver(h,isLive){
if(!h)return"—";
let html="";
h.forEach((o,i)=>{
if(!o.length)return;
let label=(isLive&&i===h.length-1&&o.length<6)
? `<b>Current Over (${i+1})</b>`
: `Over ${i+1}`;
html+=`${label}: ${o.join(" ")} | Runs: ${overRuns(o)}<br>`;
});
return html;
}
function openOverHistory(){
  document.getElementById("mainScreen").style.display="none";
  document.getElementById("overHistoryScreen").style.display="block";

  document.getElementById("overInningText").innerText =
    `Current Innings: ${inning === 1 ? "First" : "Second"}`;

  // ✅ FIXED LOGIC
  if (inning === 1) {
    // First innings running
    document.getElementById("firstOverHistory").innerHTML =
      formatOver(history, true);
    document.getElementById("secondOverHistory").innerHTML = "—";
  } else {
    // Second innings running or finished
    document.getElementById("firstOverHistory").innerHTML =
      formatOver(firstHistory, false);
    document.getElementById("secondOverHistory").innerHTML =
      formatOver(history, true);
  }
}

/* MATCH HISTORY */
function openMatchHistory(){
document.getElementById("mainScreen").style.display="none";
document.getElementById("matchHistoryScreen").style.display="block";
let html="";
matches.forEach((m,i)=>html+=`<b>Match ${i+1}</b>: ${m.teams} — Winner: ${m.winner}<br>`);
document.getElementById("matchList").innerHTML=html||"No matches yet";
}

/* NAV */
function backToMain(){
document.querySelectorAll(".card").forEach(c=>c.style.display="none");
document.getElementById("mainScreen").style.display="block";
}
  
</script>

</body>
</html>
