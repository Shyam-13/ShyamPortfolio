<!DOCTYPE html>
<html>
<head>
<title>Cricket Score App</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
}

/* PAGE */
html,body{
  margin:0;
  padding:0;
  height:100%;
  font-family:Arial;
  background:#eef2f5;
}

body{
  display:flex;
  justify-content:center;
}

/* APP CONTAINER */
.card{
  width:100%;
  min-height:100vh;
  max-width:600px;
  background:#fff;
  padding:clamp(8px,2vw,14px);
  overflow-y:auto;
}

/* DESKTOP */
@media(min-width:768px){
  .card{
    margin:12px 0;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
  }
}

/* TEXT */
h2{
  font-size:clamp(16px,4vw,22px);
}
h3,h4{
  font-size:clamp(14px,3.5vw,18px);
}
h2,h3,h4{
  text-align:center;
  margin:4px 0;
}

/* SCORE */
.score{
  font-size:clamp(24px,7vw,36px);
  font-weight:bold;
  text-align:center;
}

.currentOver{
  font-size:clamp(11px,2.8vw,14px);
  color:#555;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* INPUT */
input{
  padding:clamp(5px,1.5vw,8px);
  font-size:clamp(11px,2.8vw,14px);
  width:100%;
  max-width:150px;
  margin:3px;
}

/* BUTTON ROW */
.btn-row{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}

/* BUTTONS */
button{
  padding:clamp(6px,1.8vw,12px);
  margin:clamp(3px,1vw,6px);
  width:100%;
  max-width:clamp(70px,18vw,110px);
  font-size:clamp(11px,2.8vw,14px);
  border:none;
  border-radius:6px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:transform .08s ease, box-shadow .08s ease;
}

button:disabled{opacity:.4}

/* TOUCH SCALE */
button:active{
  transform:scale(0.94);
  box-shadow:inset 0 0 8px rgba(0,0,0,.25);
}

/* RIPPLE EFFECT */
button::after{
  content:"";
  position:absolute;
  top:50%;
  left:50%;
  width:0;
  height:0;
  background:rgba(255,255,255,.35);
  border-radius:50%;
  transform:translate(-50%,-50%);
  opacity:0;
}
button:active::after{
  width:120%;
  height:120%;
  opacity:1;
  transition:width .35s ease,height .35s ease,opacity .5s;
}

/* BIG BUTTONS */
.start,.reset,.ctrl,.undo{
  max-width:clamp(150px,45vw,260px);
}

/* COLORS */
.start{background:#2e7d32;color:#fff}
.reset{background:#b71c1c;color:#fff}
.ctrl{background:#1565c0;color:#fff}
.undo{background:#333;color:#fff}
.dot{background:#607d8b;color:#fff}
.wide{background:#ff9800;color:#fff}
.nb{background:#9c27b0;color:#fff}
.w{background:#e53935;color:#fff}

/* RESULT */
.result{
  text-align:center;
  font-size:clamp(13px,3vw,16px);
  font-weight:bold;
  margin-top:6px;
}

/* 🎉 WIN ANIMATION */
@keyframes winPop{
  0%{transform:scale(.6);opacity:0}
  60%{transform:scale(1.15);opacity:1}
  100%{transform:scale(1)}
}
@keyframes glow{
  0%{text-shadow:0 0 0 rgba(0,255,0,0)}
  50%{text-shadow:0 0 12px rgba(0,255,0,.8)}
  100%{text-shadow:0 0 0 rgba(0,255,0,0)}
}
.result.win{
  animation:winPop .6s ease, glow 1.2s ease infinite;
  color:#2e7d32;
}
</style>
</head>

<body>

<!-- MAIN SCREEN -->
<div class="card" id="mainScreen">
<h2>Cricket Score App</h2>

<div align="center">
<input id="teamA" value="Team A"> vs
<input id="teamB" value="Team B">
</div>

<div align="center">
Total Overs:
<input type="number" id="totalOvers" value="10" min="1">
</div>

<div class="btn-row">
<button class="start" id="startBtn" onclick="startMatch()">START MATCH</button>
<button class="reset" onclick="resetMatch()">RESET</button>
</div>

<div class="btn-row">
<button class="ctrl" id="overHistoryBtn" onclick="openOverHistory()" disabled>OVER HISTORY</button>
<button class="ctrl" onclick="openMatchHistory()">MATCH HISTORY</button>
</div>

<h3 id="inningText">—</h3>
<div class="score" id="score">0/0</div>
<div class="currentOver" id="currentOver">Current Over: —</div>
<div align="center" id="overs">Overs: 0.0</div>
<div align="center" id="target"></div>

<div class="btn-row">
<button class="dot scoreBtn" onclick="ball(0)" disabled>0</button>
<button class="scoreBtn" onclick="ball(1)" disabled>1</button>
<button class="scoreBtn" onclick="ball(2)" disabled>2</button>
<button class="scoreBtn" onclick="ball(3)" disabled>3</button>
<button class="scoreBtn" onclick="ball(4)" disabled>4</button>
<button class="scoreBtn" onclick="ball(5)" disabled>5</button>
<button class="scoreBtn" onclick="ball(6)" disabled>6</button>
</div>

<div class="btn-row">
<button class="wide scoreBtn" onclick="extra('Wd')" disabled>Wide</button>
<button class="nb scoreBtn" onclick="extra('Nb')" disabled>No Ball</button>
</div>

<div class="btn-row">
<button class="w scoreBtn" onclick="wicket()" disabled>Wicket</button>
</div>

<div class="btn-row">
<button class="undo" onclick="undo()">UNDO</button>
<button class="ctrl" id="endBtn" onclick="endInnings()" disabled>END INNINGS</button>
</div>

<div class="result" id="result"></div>
</div>

<script>
let started=false, inning=1;
let runs=0,wickets=0,balls=0,totalBalls=0,target=0,matchOver=false;
let history=[[]],firstHistory=null,secondHistory=null;
let stack=[];
let matches=JSON.parse(localStorage.getItem("matches"))||[];

function enableScore(e){
document.querySelectorAll(".scoreBtn").forEach(b=>b.disabled=!e);
document.getElementById("endBtn").disabled=!e||inning!==1;
document.getElementById("overHistoryBtn").disabled=!started;
}

function save(){
stack.push(JSON.stringify({runs,wickets,balls,history,inning,target,matchOver,firstHistory}))
}

function undo(){
if(!stack.length)return;
let s=JSON.parse(stack.pop());
runs=s.runs;wickets=s.wickets;balls=s.balls;
history=s.history;inning=s.inning;
target=s.target;matchOver=s.matchOver;
firstHistory=s.firstHistory;
document.getElementById("result").classList.remove("win");
document.getElementById("result").innerText="";
update();
}

function canPlay(){return started&&!matchOver&&balls<totalBalls}

function startMatch(){
totalBalls=document.getElementById("totalOvers").value*6;
started=true;inning=1;
enableScore(true);
document.getElementById("startBtn").disabled=true;
document.getElementById("inningText").innerText="First Innings";
update();
}

function ball(r){
if(!canPlay())return;
save();
runs+=r;balls++;
history.at(-1).push(r===0?".":r);
if(balls%6===0)history.push([]);
update();
}

function extra(t){
if(!canPlay())return;
let ex=parseInt(prompt("Runs on "+t,1))||1;
save();runs+=ex;
history.at(-1).push(`${t}+${ex}`);
update();
}

function wicket(){
if(!canPlay())return;
save();wickets++;balls++;
history.at(-1).push("W");
if(balls%6===0)history.push([]);
update();
}

function endInnings(){
if(inning!==1)return;
firstHistory=JSON.parse(JSON.stringify(history));
target=runs+1;
runs=wickets=balls=0;
history=[[]];inning=2;
document.getElementById("inningText").innerText="Second Innings";
update();
}

function update(){
score.innerText=`${runs}/${wickets}`;
overs.innerText=`Overs: ${Math.floor(balls/6)}.${balls%6}`;
currentOver.innerText=`Current Over: ${history.at(-1).join(" ")||"—"}`;
target.innerText=inning===2?`Target: ${target}`:"";
enableScore(started&&!matchOver);

if(inning===2&&!matchOver){
if(runs>=target)finish(teamB.value);
else if(balls>=totalBalls||wickets>=10)finish(teamA.value);
}
}

function finish(winner){
matchOver=true;
result.innerText=`${winner} WON THE MATCH 🎉`;
result.classList.add("win");
enableScore(false);
}

function resetMatch(){
started=false;inning=1;
runs=wickets=balls=0;
history=[[]];firstHistory=null;secondHistory=null;
target=0;matchOver=false;stack=[];
startBtn.disabled=false;
inningText.innerText="—";
result.classList.remove("win");
result.innerText="";
enableScore(false);
update();
}
</script>

</body>
</html>
